name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 0.8.2604301200)'
        required: true
        default: ''

jobs:
  build-server:
    runs-on: ubuntu-latest
    container: ubuntu:24.04

    steps:
      - name: Install Go
        run: |
          apt-get update && apt-get install -y golang-go

      - name: Checkout submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Go Server
        run: |
          cd server
          go build -ldflags "-X main.version=${{ github.event.inputs.version || '0.8.$(date +%y%m%d%H%M)' }}" -o iina-remote-server .

      - name: Upload Server Binary
        uses: actions/upload-artifact@v4
        with:
          name: iina-remote-server
          path: server/iina-remote-server

  build-android:
    runs-on: ubuntu-latest
    container: ubuntu:24.04

    steps:
      - name: Checkout submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        run: |
          apt-get update && apt-get install -y openjdk-21-jdk

      - name: Setup Android SDK
        run: |
          apt-get install -y wget unzip
          mkdir -p /opt/android-sdk/cmdline-tools
          cd /opt/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip

      - name: Setup Android SDK environment
        run: |
          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          echo "PATH=$PATH:/opt/android-sdk/cmdline-tools/latest/bin:/opt/android-sdk/platform-tools" >> $GITHUB_ENV

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Build Android App
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon -q

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

  build-info:
    runs-on: ubuntu-latest
    needs: [build-server, build-android]

    steps:
      - name: Generate build info
        run: |
          echo "=== Release Build Complete ==="
          echo "Version: ${{ github.event.inputs.version || '0.8.$(date +%y%m%d%H%M)' }}"
          echo ""
          echo "Artifacts:"
          echo "  - Go Server: iina-remote-server (see build-server job)"
          echo "  - Android APK: app-release.apk (see build-android job)"
          echo ""
          echo "Note: macOS app must be built locally (GitHub Actions free tier doesn't support macOS runners)"
