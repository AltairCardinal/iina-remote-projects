name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 0.8.2604301200)'
        required: false
        default: ''

env:
  VERSION: ${{ github.event.inputs.version || '0.8.2604300000' }}

jobs:
  build-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Go Server
        run: |
          cd server
          go build -ldflags "-X main.version=${{ env.VERSION }}" -o iina-remote-server .

      - name: Upload Server Binary
        uses: actions/upload-artifact@v4
        with:
          name: iina-remote-server
          path: server/iina-remote-server
          retention-days: 5

  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android App
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -q

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 5
